[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "toolchain-set/check"]
# The set check is heavy; build it explicitly (`cargo build -p perox-set-check`).
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/deveshrai/perox-tools"
publish = false

[workspace.dependencies]
perox-core = { path = "crates/perox-core" }
perox-mcp = { path = "crates/perox-mcp" }
eframe = "=0.37.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Same versions as the Toolchain Set (toolchain-set/check/Cargo.toml).
egui_tiles = "=0.18.0"
rand = "=0.10.4"
directories = "=6.0.0"
chrono = "=0.4.45"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
