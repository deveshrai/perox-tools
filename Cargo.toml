[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "examples/*", "toolchain-set/check"]
# The set check is heavy; build it explicitly (`cargo build -p perox-set-check`).
default-members = ["crates/*", "apps/*", "examples/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/deveshrai/perox-tools"
publish = false

[workspace.dependencies]
perox-core = { path = "crates/perox-core" }
perox-mcp = { path = "crates/perox-mcp" }
perox-editor = { path = "crates/perox-editor" }
perox-lsp = { path = "crates/perox-lsp" }
perox-project = { path = "crates/perox-project" }
perox-build = { path = "crates/perox-build" }
perox-icons = { path = "crates/perox-icons" }
perox-terminal = { path = "crates/perox-terminal" }
perox-ui = { path = "crates/perox-ui" }
perox-designer = { path = "crates/perox-designer" }
perox-slint = { path = "crates/perox-slint" }
perox-package = { path = "crates/perox-package" }
perox-brand = { path = "crates/perox-brand" }
perox-dap = { path = "crates/perox-dap" }
# Slint, pinned exactly: the designer uses its internal APIs (ADR 0011).
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2"] }
slint-interpreter = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18"] }
slint-build = "=1.19.0"
i-slint-compiler = "=1.19.0"
i-slint-core = "=1.19.0"
eframe = "=0.37.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Same versions as the Toolchain Set (toolchain-set/check/Cargo.toml).
egui_tiles = "=0.18.0"
rand = "=0.10.4"
directories = "=6.0.0"
chrono = "=0.4.45"
rfd = "=0.18.0"
ttf-parser = "=0.25.1"
# Same as the Toolchain Set: SQLite for perox-ui's data module and the designer.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "=1.54.1", features = ["rt"] }
notify = "=8.2.2"
similar = "=3.2.1"
regex = "=1.13.1"
egui_extras = { version = "=0.37.0", features = ["svg"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The intro's scene is drawn per pixel: fast even in debug builds.
[profile.dev.package.perox-brand]
opt-level = 3

# The calculator's plots are redrawn while dragging.
[profile.dev.package.graphing-calculator]
opt-level = 1
