[package]
name = "graphing-calculator"
description = "Sample PeroxIDE app: a scientific calculator with 2D graphs of up to three functions and 3D surfaces z = f(x, y), drawn with the designer's Canvas. Built in PeroxIDE by an agent over MCP (see BUILDING.md)."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.peroxide]
display-name = "Graphing Calculator"

[dependencies]
perox-ui.workspace = true
slint = { version = "=1.19.0" }

[build-dependencies]
perox-slint = { workspace = true, features = ["build"] }

[lints]
workspace = true
