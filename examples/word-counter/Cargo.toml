[package]
name = "word-counter"
description = "Example PeroxIDE app: Slint forms plus Rust code-behind. Also what File > New GUI App creates."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
perox-ui.workspace = true
slint = { version = "=1.19.0" }

[build-dependencies]
perox-slint = { workspace = true, features = ["build"] }

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"

[lints]
workspace = true
