[package]
name = "stock-dashboard"
description = "Sample PeroxIDE app: a stock watchlist with live quotes, a price chart, the day's numbers, history and company details, in a modern dark design. Built in PeroxIDE by an agent over MCP (see BUILDING.md)."
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
perox-ui.workspace = true
slint = { version = "=1.19.0" }
serde_json.workspace = true
ureq = "=3.5.2"
webbrowser = "=1.2.7"

[build-dependencies]
perox-slint = { workspace = true, features = ["build"] }

[lints]
workspace = true
