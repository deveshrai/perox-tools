[package]
name = "perox-slint"
description = "The .slint documents PeroxIDE's designer edits: an element tree with exact source spans, text-preserving edits, and handler code generation for build.rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Runs inside user builds (build.rs), so permissive (ADR 0004, 0011).
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
# `build::compile` for build.rs: runs slint-build, then writes the handlers module.
build = ["dep:slint-build"]

[dependencies]
i-slint-compiler = { workspace = true }
# Same rowan as i-slint-compiler: its syntax nodes deref to rowan nodes.
rowan = "0.17"
serde_json = { workspace = true }
slint-build = { workspace = true, optional = true }

[lints]
workspace = true
