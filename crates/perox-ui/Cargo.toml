[package]
name = "perox-ui"
description = "The runtime PeroxIDE apps use on top of Slint: the generated-handlers include, native message boxes, and dialogs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Ships inside user apps (ADR 0004, 0011).
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
rfd.workspace = true
slint = { workspace = true, features = ["raw-window-handle-06"] }

[dev-dependencies]
slint = { workspace = true, features = ["renderer-software"] }

[lints]
workspace = true
