[package]
name = "perox-ui"
description = "The runtime PeroxIDE apps use on top of Slint: the generated-handlers include, native message boxes, and dialogs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Ships inside user apps (ADR 0004, 0011).
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true

[features]
# `data::Database`: SQLite through sqlx.
sqlite = ["dep:sqlx", "dep:tokio"]

[dependencies]
rfd.workspace = true
image.workspace = true
tiny-skia = "=0.12.0"
slint = { workspace = true, features = ["raw-window-handle-06"] }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
slint = { workspace = true, features = ["renderer-software"] }

[lints]
workspace = true
