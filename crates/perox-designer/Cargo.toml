[package]
name = "perox-designer"
description = "PeroxIDE's form designer for .slint files: canvas rendered by Slint, widget palette, object tree, property inspector. Every change is a minimal edit to the .slint text."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
i-slint-compiler.workspace = true
i-slint-core.workspace = true
perox-icons.workspace = true
perox-slint.workspace = true
slint = { workspace = true, features = ["renderer-software"] }
slint-interpreter = { workspace = true, features = ["internal-highlight", "bundle-translations"] }
spin_on = "0.1"
rfd.workspace = true
ttf-parser.workspace = true

[lints]
workspace = true

# egui's fontique 0.11 switches the shared fontconfig-sys to dlopen mode; Slint's fontique
# 0.12 must use the same mode or it won't compile (Linux, both in one binary).
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }
